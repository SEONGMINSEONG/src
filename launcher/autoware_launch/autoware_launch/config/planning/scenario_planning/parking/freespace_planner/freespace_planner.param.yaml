/**:
  ros__parameters:
    # -- Node Configurations --
    planning_algorithm: "astar"
    waypoints_velocity: 5.0 #4.0 #5.0
    update_rate: 20.0 #10.0
    th_arrived_distance_m: 0.5
    th_stopped_time_sec: 0.01
    th_stopped_velocity_mps: 0.1 #0.01
    th_course_out_distance_m: 1.0
    th_obstacle_time_sec: 1.0
    vehicle_shape_margin_m: 0.0 #0.4
    replan_when_obstacle_found: true
    replan_when_course_out: true

    # -- Configurations common to the all planners --
    # base configs
    time_limit: 30000.0 # 30000.0 251021JSJ
    # robot configs # TODO replace by vehicle_info
    max_turning_ratio: 0.6 # ratio of actual turning limit of vehicle
    turning_steps: 3 #5 #1
    # search configs
    theta_size: 120 #120
    angle_goal_range: 4.0 #10.0   #6.0 HS
    lateral_goal_range: 0.3 #0.5
    longitudinal_goal_range: 0.8   #0.4 HS #1.0
    curve_weight: 0.3 #0.5
    reverse_weight: 0.4 #0.7
    direction_change_weight: 1.0 #2.0
    # costmap configs
    obstacle_threshold: 100 #100

    # -- A* search Configurations --
    astar:
      search_method: "backward"  # options: forward, backward
      only_behind_solutions: false
      use_back: true
      adapt_expansion_distance: true
      expansion_distance: 0.5
      near_goal_distance: 4.0  #3.0 HS
      distance_heuristic_weight: 2.0
      smoothness_weight: 0.3
      obstacle_distance_weight: 0.5 #1.75
      goal_lat_distance_weight: 5.0

    # -- RRT* search Configurations --
    rrtstar:
      enable_update: true
      use_informed_sampling: true
      max_planning_time: 150.0
      neighbor_radius: 8.0
      margin: 0.1
